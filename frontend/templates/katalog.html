{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <div class="d-flex justify-content-between mb-4">
        <h2>📚 Katalog Perpustakaan</h2>
        <a href="{{ url_for('main.login') }}" class="btn btn-outline-primary">Portal Admin</a>
    </div> 
    <div class="row">
        {% for b in buku %}
        <div class="col-md-3 mb-4">
            <div class="card p-3 h-100 text-center">
                <i class="bi bi-book fs-1 text-primary mb-2"></i>
                <h6 class="fw-bold">{{ b.judul }}</h6>
                <p class="text-muted small">ISBN: {{ b.isbn }}</p>
                <div class="badge {% if b.stok > 0 %}bg-success{% else %}bg-danger{% endif %}">Stok: {{ b.stok }}</div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
