{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="height: 100vh;">
    <div class="card p-4 shadow" style="width: 350px;">
        <h4 class="text-center mb-4">Register Petugas</h4>
        <form method="POST">
            <input name="user" class="form-control mb-3" placeholder="Username" required>
            <input type="password" name="pass" class="form-control mb-4" placeholder="Password" required>
            <button class="btn btn-success w-100 text-white">Daftar</button>
        </form>
    </div>
</div>
{% endblock %}
