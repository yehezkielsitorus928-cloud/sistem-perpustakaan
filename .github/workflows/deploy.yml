name: Deploy Library System to GCP

on:
  push:
  - main
  - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Determine Target Environment
      id: env-setup
      run: |
        if [ "${{ github.ref }}" == "refs/heads/main" ]; then
          echo "TARGET_DIR=app-production" >> $GITHUB_ENV
          echo "COMPOSE_FILE=docker-compose.yml" >> $GITHUB_ENV
        else
          echo "TARGET_DIR=app-staging" >> $GITHUB_ENV
          echo "COMPOSE_FILE=docker-compose.staging.yml" >> $GITHUB_ENV
        fi

    - name: Deploy to GCP Instance via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.GCP_HOST }}
        username: ${{ secrets.GCP_USERNAME }}
        key: ${{ secrets.GCP_SSH_KEY }}
        script: |
          cd ~/${{ env.TARGET_DIR }}
          git pull origin ${{ github.ref_name }} || true
          docker compose -f ${{ env.COMPOSE_FILE }} down
          docker compose -f ${{ env.COMPOSE_FILE }} up -d --build
